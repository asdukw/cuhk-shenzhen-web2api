[project]
name = "cuhk-shenzhen-web2api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "asdukw", email = "asdukw@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "firecrawl",
    "uvicorn[standard]>=0.52.4",
]

[project.optional-dependencies]
local = ["httpx>=0.28,<1", "playwright>=1.50,<2"]
kilo = ["httpx>=0.28,<1", "playwright>=1.50,<2", "jsonschema>=4.23,<5"]

[dependency-groups]
dev = [
    "ruff",
    "pyright",
]

[project.scripts]
cuhk-shenzhen-web2api = "cuhk_shenzhen_web2api:main"

[tool.pyright]
pythonVersion = "3.12"
# Scripts are thin live-site runners whose real logic lives in the package.
include = ["src/cuhk_shenzhen_web2api"]


[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
